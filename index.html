<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEC Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="assets/aec-favicon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 96px;
    }

    body {
      background-color: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid rgba(39, 44, 88, 0.12);
      box-shadow: 0 8px 28px rgba(18, 28, 58, 0.08);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      width: 100%;
      max-width: 1320px;
      min-height: 78px;
      margin: 0 auto;
      padding: 10px 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      border-radius: 8px;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 142px;
      height: 48px;
      object-fit: contain;
    }

    .primary-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 15px;
      border-radius: 8px;
      color: #46506f;
      font-size: 0.94rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .nav-link:hover,
    .nav-link:focus-visible,
    .nav-link.is-active {
      background: #f0f2fb;
      color: #272c58;
    }

    .nav-link.is-active::after {
      position: absolute;
      right: 15px;
      bottom: 5px;
      left: 15px;
      height: 2px;
      border-radius: 2px;
      background: #617bf0;
      content: "";
    }

    .brand:focus-visible,
    .nav-link:focus-visible,
    .menu-toggle:focus-visible {
      outline: 3px solid #617bf0;
      outline-offset: 3px;
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      place-content: center;
      gap: 5px;
      border: 1px solid #e1e4ef;
      border-radius: 10px;
      background: #fff;
      color: #272c58;
      cursor: pointer;
    }

    .portfolio-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 1200px;
      padding: 16px 12px 24px;
    }

    .portfolio-page {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      background-color: #1e293b; /* Placeholder color before image paints */
    }

    @media (max-width: 760px) {
      .header-inner {
        min-height: 72px;
        padding: 10px 18px;
      }

      .brand img {
        width: 128px;
        height: 44px;
      }

      .menu-toggle {
        display: grid;
      }

      .menu-toggle span {
        display: block;
        width: 18px;
        height: 2px;
        border-radius: 2px;
        background: #272c58;
        transition: transform 160ms ease;
      }

      .menu-toggle[aria-expanded="true"] span:first-child {
        transform: translateY(3.5px) rotate(45deg);
      }

      .menu-toggle[aria-expanded="true"] span:last-child {
        transform: translateY(-3.5px) rotate(-45deg);
      }

      .primary-nav {
        position: absolute;
        top: calc(100% + 1px);
        right: 0;
        left: 0;
        display: none;
        align-items: stretch;
        gap: 4px;
        padding: 12px 18px 18px;
        border-bottom: 1px solid rgba(39, 44, 88, 0.12);
        background: #fff;
        box-shadow: 0 16px 24px rgba(18, 28, 58, 0.1);
      }

      .primary-nav.is-open {
        display: flex;
        flex-direction: column;
      }

      .nav-link {
        min-height: 46px;
        padding: 0 14px;
      }

      .nav-link.is-active::after {
        top: 11px;
        right: auto;
        bottom: 11px;
        left: 4px;
        width: 3px;
        height: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#page-1" data-page="1" aria-label="AEC home">
        <img src="assets/aec-logo.svg" alt="AEC International">
      </a>
      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="primary-nav"
      >
        <span></span>
        <span></span>
      </button>
      <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
        <a class="nav-link" href="#page-2" data-page="2">About</a>
        <a class="nav-link" href="#page-7" data-page="7">Services</a>
        <a class="nav-link" href="#page-12" data-page="12">Projects</a>
        <a class="nav-link" href="#page-9" data-page="9">Awards</a>
        <a class="nav-link" href="#page-48" data-page="48">Leadership</a>
      </nav>
    </div>
  </header>

  <main class="portfolio-container" id="portfolio">
    <!-- Page 1 is eager-loaded with high priority for instant LCP paint -->
    <img
      id="page-1"
      src="assets/images/1.jpg"
      alt="AEC Portfolio Page 1"
      class="portfolio-page"
      loading="eager"
      fetchpriority="high"
    >
  </main>

  <script>
    const TOTAL_PAGES = 48;
    const container = document.getElementById('portfolio');
    const menuToggle = document.getElementById('menu-toggle');
    const primaryNav = document.getElementById('primary-nav');
    const sectionLinks = Array.from(document.querySelectorAll('[data-page]'))
      .map((link) => ({ link, page: Number(link.dataset.page) }))
      .sort((first, second) => first.page - second.page);

    // Dynamically append the remaining pages with native lazy-loading
    for (let i = 2; i <= TOTAL_PAGES; i++) {
      const img = document.createElement('img');
      img.id = `page-${i}`;
      img.src = `assets/images/${i}.jpg`;
      img.alt = `AEC Portfolio Page ${i}`;
      img.className = 'portfolio-page';
      img.loading = 'lazy';
      img.decoding = 'async';

      // Automatically stop rendering if a page index doesn't exist
      img.onerror = function() {
        this.remove();
      };

      container.appendChild(img);
    }

    function closeMenu() {
      primaryNav.classList.remove('is-open');
      menuToggle.setAttribute('aria-expanded', 'false');
      menuToggle.setAttribute('aria-label', 'Open navigation menu');
    }

    menuToggle.addEventListener('click', () => {
      const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
      primaryNav.classList.toggle('is-open', !isOpen);
      menuToggle.setAttribute('aria-expanded', String(!isOpen));
      menuToggle.setAttribute('aria-label', isOpen ? 'Open navigation menu' : 'Close navigation menu');
    });

    primaryNav.addEventListener('click', (event) => {
      if (event.target.closest('a')) {
        closeMenu();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeMenu();
      }
    });

    const pageObserver = new IntersectionObserver((entries) => {
      const visiblePages = entries.filter((entry) => entry.isIntersecting);
      if (visiblePages.length === 0) {
        return;
      }

      const viewportCenter = window.innerHeight / 2;
      const currentEntry = visiblePages.reduce((closest, entry) => {
        const distance = Math.abs(entry.boundingClientRect.top + entry.boundingClientRect.height / 2 - viewportCenter);
        const closestDistance = Math.abs(closest.boundingClientRect.top + closest.boundingClientRect.height / 2 - viewportCenter);
        return distance < closestDistance ? entry : closest;
      });

      const currentPage = Number(currentEntry.target.id.slice(5));
      const currentSection = sectionLinks.reduce((active, section) => (
        section.page <= currentPage ? section : active
      ), sectionLinks[0]);

      sectionLinks.forEach(({ link }) => {
        const isActive = link === currentSection.link;
        link.classList.toggle('is-active', isActive);
        if (isActive) {
          link.setAttribute('aria-current', 'location');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    }, { threshold: [0, 0.25, 0.5, 0.75, 1] });

    document.querySelectorAll('.portfolio-page').forEach((page) => pageObserver.observe(page));
  </script>

</body>
</html>
