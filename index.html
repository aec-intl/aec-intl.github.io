<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEC Portfolio</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      background-color: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      width: 100%;
      background: #fff;
      border-top: 5px solid #272c58;
      box-shadow: 0 8px 24px rgba(11, 15, 25, 0.16);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      max-width: 1224px;
      min-height: 76px;
      margin: 0 auto;
      padding: 8px 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #272c58;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 104px;
      height: 52px;
      object-fit: contain;
    }

    .presentation-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #272c58;
      font-variant-numeric: tabular-nums;
    }

    .page-count {
      min-width: 76px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .page-count strong {
      font-size: 1.1rem;
    }

    .page-count span {
      color: #68708e;
    }

    .page-button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid #272c58;
      border-radius: 50%;
      background: #fff;
      color: #272c58;
      font: inherit;
      font-size: 1.45rem;
      line-height: 1;
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .page-button:hover:not(:disabled),
    .page-button:focus-visible:not(:disabled) {
      background: #272c58;
      color: #fff;
    }

    .page-button:focus-visible,
    .brand:focus-visible {
      outline: 3px solid #617bf0;
      outline-offset: 3px;
    }

    .page-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .progress-track {
      height: 4px;
      background: #dfe3f1;
    }

    .progress-bar {
      width: 2.08%;
      height: 100%;
      background: #617bf0;
      transition: width 180ms ease;
    }

    .portfolio-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 1200px;
      padding: 16px 12px 24px;
    }

    .portfolio-page {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      background-color: #1e293b; /* Placeholder color before image paints */
    }

    @media (max-width: 540px) {
      .header-inner {
        min-height: 66px;
      }

      .brand {
        gap: 6px;
        font-size: 0.9rem;
      }

      .brand span {
        display: none;
      }

      .brand img {
        width: 76px;
        height: 38px;
      }

      .presentation-controls {
        gap: 7px;
      }

      .page-button {
        width: 34px;
        height: 34px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#page-1" aria-label="AEC Portfolio, go to the first page">
        <img src="assets/logo.png" alt="AEC">
        <span>Portfolio</span>
      </a>
      <nav class="presentation-controls" aria-label="Presentation navigation">
        <button class="page-button" id="previous-page" type="button" aria-label="Previous page" disabled>&lsaquo;</button>
        <p class="page-count" aria-live="polite">
          <strong id="current-page">01</strong>
          <span>/ <span id="total-pages">48</span></span>
        </p>
        <button class="page-button" id="next-page" type="button" aria-label="Next page">&rsaquo;</button>
      </nav>
    </div>
    <div
      class="progress-track"
      id="progress-track"
      role="progressbar"
      aria-label="Presentation progress"
      aria-valuemin="1"
      aria-valuemax="48"
      aria-valuenow="1"
    >
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </header>

  <main class="portfolio-container" id="portfolio">
    <!-- Page 1 is eager-loaded with high priority for instant LCP paint -->
    <img
      id="page-1"
      src="assets/images/1.jpg"
      alt="AEC Portfolio Page 1"
      class="portfolio-page"
      loading="eager"
      fetchpriority="high"
    >
  </main>

  <script>
    const TOTAL_PAGES = 48;
    const container = document.getElementById('portfolio');
    const currentPageLabel = document.getElementById('current-page');
    const progressTrack = document.getElementById('progress-track');
    const progressBar = document.getElementById('progress-bar');
    const previousButton = document.getElementById('previous-page');
    const nextButton = document.getElementById('next-page');
    let currentPage = 1;

    // Dynamically append the remaining pages with native lazy-loading
    for (let i = 2; i <= TOTAL_PAGES; i++) {
      const img = document.createElement('img');
      img.id = `page-${i}`;
      img.src = `assets/images/${i}.jpg`;
      img.alt = `AEC Portfolio Page ${i}`;
      img.className = 'portfolio-page';
      img.loading = 'lazy';
      img.decoding = 'async';

      // Automatically stop rendering if a page index doesn't exist
      img.onerror = function() {
        this.remove();
      };

      container.appendChild(img);
    }

    document.getElementById('total-pages').textContent = String(TOTAL_PAGES);
    progressTrack.setAttribute('aria-valuemax', String(TOTAL_PAGES));

    function setCurrentPage(page) {
      currentPage = page;
      currentPageLabel.textContent = String(page).padStart(2, '0');
      progressTrack.setAttribute('aria-valuenow', String(page));
      progressBar.style.width = `${(page / TOTAL_PAGES) * 100}%`;
      previousButton.disabled = page === 1;
      nextButton.disabled = page === TOTAL_PAGES;
    }

    function goToPage(page) {
      const boundedPage = Math.min(Math.max(page, 1), TOTAL_PAGES);
      const target = document.getElementById(`page-${boundedPage}`);
      if (!target) {
        return;
      }

      target.scrollIntoView({
        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
        block: 'start'
      });
      setCurrentPage(boundedPage);
    }

    previousButton.addEventListener('click', () => goToPage(currentPage - 1));
    nextButton.addEventListener('click', () => goToPage(currentPage + 1));

    document.addEventListener('keydown', (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) {
        return;
      }

      if (event.key === 'ArrowLeft') {
        goToPage(currentPage - 1);
      } else if (event.key === 'ArrowRight') {
        goToPage(currentPage + 1);
      }
    });

    const pageObserver = new IntersectionObserver((entries) => {
      const visiblePages = entries.filter((entry) => entry.isIntersecting);
      if (visiblePages.length === 0) {
        return;
      }

      const viewportCenter = window.innerHeight / 2;
      const currentEntry = visiblePages.reduce((closest, entry) => {
        const distance = Math.abs(entry.boundingClientRect.top + entry.boundingClientRect.height / 2 - viewportCenter);
        const closestDistance = Math.abs(closest.boundingClientRect.top + closest.boundingClientRect.height / 2 - viewportCenter);
        return distance < closestDistance ? entry : closest;
      });

      setCurrentPage(Number(currentEntry.target.id.slice(5)));
    }, { threshold: [0, 0.25, 0.5, 0.75, 1] });

    document.querySelectorAll('.portfolio-page').forEach((page) => pageObserver.observe(page));
    setCurrentPage(1);
  </script>

</body>
</html>
